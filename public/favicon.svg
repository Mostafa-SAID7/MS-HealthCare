<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Background -->
  <rect width="180" height="180" fill="#ffffff" rx="40"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Medical cross symbol -->
  <g>
    <!-- Vertical bar -->
    <rect x="70" y="40" width="40" height="100" fill="url(#healthGradient)" rx="8"/>
    <!-- Horizontal bar -->
    <rect x="40" y="70" width="100" height="40" fill="url(#healthGradient)" rx="8"/>
  </g>
  
  <!-- Heartbeat line accent -->
  <path d="M 30 145 L 40 145 L 45 135 L 55 155 L 65 145 L 150 145" stroke="#0066cc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
